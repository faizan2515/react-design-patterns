<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="An interactive catalog of React design patterns — every one a running example with its source alongside."
    />
    <title>React Design Patterns</title>

    <script>
      // Runs before first paint, so a stored preference never flashes the wrong theme.
      // Absent or invalid, we set nothing and `color-scheme: light dark` follows the OS.
      try {
        var stored = localStorage.getItem("rdp-theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (error) {
        /* private mode, disabled storage — the OS preference is a fine fallback */
      }
      window.__rdpSplashStart = performance.now();
    </script>

    <style>
      /*
        Inlined deliberately. The splash has to be painted before the CSS bundle or the
        fonts arrive, so it cannot depend on either — hence system monospace here and the
        real display face only once the app takes over.
      */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        color-scheme: light dark;
        background: light-dark(#ffffff, #16171d);
        color: light-dark(#08060d, #f3f4f6);
        transition: opacity 400ms ease;
      }

      :root[data-theme="light"] #splash {
        color-scheme: light;
      }
      :root[data-theme="dark"] #splash {
        color-scheme: dark;
      }

      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .splash-mark {
        display: flex;
        align-items: center;
        white-space: nowrap;
        font-family: ui-monospace, Consolas, "Cascadia Code", monospace;
        font-size: clamp(20px, 5vw, 34px);
        font-weight: 500;
        letter-spacing: -0.04em;
      }

      .splash-bracket {
        color: light-dark(#aa3bff, #c084fc);
      }

      /*
        The whole animation: the middle starts at zero width, so the two brackets sit
        together and read as `</>`. Expanding it reveals the wordmark between them.
      */
      .splash-mid {
        display: inline-block;
        overflow: hidden;
        max-width: 0;
        opacity: 0;
        animation: splash-open 780ms cubic-bezier(0.16, 1, 0.3, 1) 380ms forwards;
      }

      @keyframes splash-open {
        to {
          max-width: 18ch;
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-mid {
          animation: none;
          max-width: 18ch;
          opacity: 1;
        }
        #splash {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading React Design Patterns">
      <div class="splash-mark" aria-hidden="true">
        <span class="splash-bracket">&lt;</span><span class="splash-mid"
          >react&nbsp;patterns&nbsp;</span
        ><span class="splash-bracket">/&gt;</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
